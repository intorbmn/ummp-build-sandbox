pluginManagement {
    repositories {
        gradlePluginPortal()
        // Plugin dependencies (e.g. gson) are not always served by the plugin portal.
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'demowidget'
