# Data rules for modpack migration (Phase 10, ADR 0013). Sample names are synthetic.
#
# [[replacement]]: when a pack contains mod `from` and the target has no version of it, plan to
# use `to` instead. `loader` limits the rule to one target loader. Adding a rule = adding a row.

[[replacement]]
from = "demowidget-legacy"
to = "demowidget"
loader = "fabric"
note = "Synthetic example: the legacy build was merged into the main mod."

# [[config_rule]]: since Minecraft `since_mc`, mod `mod_id` renamed a key (and/or the file) in `file`.
# Applied when a pack moves from before `since_mc` to `since_mc` or later. Keys are matched exactly,
# in TOML, JSON, .properties and Forge .cfg files; formatting and comments are kept.

[[config_rule]]
mod_id = "demowidget"
since_mc = "1.21"
file = "config/demowidget.toml"
rename_key = [{ from = "size", to = "capacity" }]
