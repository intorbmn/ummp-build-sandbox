[package]
name = "ummp-core"
version = "1.0.0-rc.1"
edition = "2021"
description = "Core engine for Universal Minecraft Mod Porter"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
zip = "9.0.5"
similar = "2"
toml = "0.8"
tempfile = "3"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "phase13"
harness = false

[lints]
workspace = true