// Minimal ForgeGradle 4 build for the Phase 6 migration fixture (not built in CI).
plugins { id 'net.minecraftforge.gradle' version '4.1.+' }
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft { mappings channel: mapping_channel, version: mapping_version } // MCP names
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
