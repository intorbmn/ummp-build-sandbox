name: UMMP Phase 12D Action smoke

on:
  push:
    branches:
      - ummp/phase-12d-action-smoke-2
  pull_request:
    branches:
      - ummp/build-demo-20261119-143211

jobs:
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UMMP Action from the feature branch
        id: ummp
        uses: intorbmn/Universal-Minecraft-Mod-Porter@phase-12d-action
        with:
          command: scan
          path: .
          fail-on-risk: high

      - name: Verify Action outputs and report
        shell: bash
        env:
          EXIT_CODE: ${{ steps.ummp.outputs.exit-code }}
          REPORT_PATH: ${{ steps.ummp.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_PATH/result.json"
          jq -e '.schema == 1 and .command == "scan" and (.result.findings | type == "array")' "$REPORT_PATH/result.json"
