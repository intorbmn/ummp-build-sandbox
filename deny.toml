[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is currently required by rmcp; no safe upstream upgrade is available yet. Revisit before release." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "MIT-0",
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
