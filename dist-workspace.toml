[workspace]
members = ["cargo:cli"]

[dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
installers = ["shell", "powershell", "msi"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
windows-archive = ".zip"
unix-archive = ".tar.gz"
install-path = "CARGO_HOME"
auto-includes = true
allow-dirty = ["ci", "msi"]
pr-run-mode = "plan"
