[package]
name = "ummp-desktop"
version = "1.0.0-rc.1"
description = "UMMP desktop shell (Tauri 2). Calls ummp-core application services only."
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "ummp_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "ummp-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ummp-core = { path = "../../core" }
ummp-ai-providers = { path = "../../providers" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
